[package]
name = "inspector"
version = "0.0.2"
edition = "2021"
description = "Reference-free assembly evaluator and error corrector for long-read sequencing"
authors = ["Colin Davenport"]

[[bin]]
name = "inspector-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.8"
statrs = "0.18"
regex = "1.10"
flate2 = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.17"
noodles = { version = "0.111", features = ["fastq"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
